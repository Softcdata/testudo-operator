                  parallelism:
                    description: Parallelism 全局最大并行实例数。0 表示无限制。
                    type: integer
                  retryPolicy:
                    description: RetryPolicy 默认重试策略
                    properties:
                      maxRetries:
                        default: 0
                        description: MaxRetries 最大重试次数，默认为 0（不重试）
                        format: int32
                        type: integer
                      retryIntervalSeconds:
                        default: 5
                        description: RetryIntervalSeconds 重试间隔秒数，默认为 5
                        format: int32
                        type: integer
                    type: object
                  timeoutMin:
                    description: TimeoutMin 单个 Level 的超时时间(分钟)。超过则根据 FailPolicy 处理。
