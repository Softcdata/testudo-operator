---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-testudo-softcdata-com-v1-cluster
  failurePolicy: Fail
  name: vcluster.kb.io
  rules:
  - apiGroups:
    - testudo.softcdata.com
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - clusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-testudo-softcdata-com-v1-disasterinstance
  failurePolicy: Fail
  name: vdisasterinstance.kb.io
  rules:
  - apiGroups:
    - testudo.softcdata.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - disasterinstances
  sideEffects: None
